[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions."newsletter-sync-background"]
  included_files = [
    "public/onboarding/ipn-logo.png",
    "public/newsletters/brand/Geist-Regular.ttf",
  ]

# Fail before publishing if the additive guest RSVP setup has not been applied.
[context.production]
  command = "npm run release:check && npm run build"
